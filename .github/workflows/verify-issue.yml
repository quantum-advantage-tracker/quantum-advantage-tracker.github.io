name: Submissions workflow

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: write

jobs:
  create_preview:
    runs-on: ubuntu-latest

    # Runs when an assignee confirms they verified a submission issue, either by
    # posting a new comment or by editing an existing one to add the phrase.
    # (Comments can't go inside the `if:` block: in a folded scalar they would be
    # part of the expression, so every condition is explained here instead.)
    #
    #  1. Trigger: a new comment ('created'), or an edited comment ('edited')
    #     whose PREVIOUS text (`changes.body.from`) contained neither verification
    #     phrase. This way only the edit that adds the phrase triggers; later
    #     edits (typo fixes, rewording the phrase) don't post duplicate previews.
    #  2. The comment is on an issue, not on a pull request.
    #  3. The issue has the `submission` label.
    #  4. The NEW comment text contains one of the accepted verification phrases.
    #  5. The comment author is one of the issue's assignees. This also keeps the
    #     bot's own preview comments from triggering this job (the bot isn't an
    #     assignee), which matters because the other jobs edit those comments.
    if: >-
      (
        github.event.action == 'created' ||
        (
          github.event.action == 'edited' &&
          !contains(github.event.changes.body.from, 'I verified the submission') &&
          !contains(github.event.changes.body.from, 'I verified this submission')
        )
      ) &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'submission') &&
      (contains(github.event.comment.body, 'I verified the submission') || contains(github.event.comment.body, 'I verified this submission')) &&
      contains(github.event.issue.assignees.*.login, github.event.comment.user.login)

    steps:
      - name: Set project Status to Verified
        env:
          GH_TOKEN: ${{ secrets.APPLIER_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          PROJECT_ID: PVT_kwDODnSE-s4BHdcB # Quantum Advantage Tracker
          FIELD_ID: PVTSSF_lADODnSE-s4BHdcBzg4NXPI # Status
          OPTION_ID: a8e0681b # Verified
        run: |
          set -euo pipefail

          ITEM_ID=$(gh api graphql -f query='
            mutation($project:ID!,$content:ID!){
              addProjectV2ItemById(input:{projectId:$project, contentId:$content}){
                item{ id }
              }
            }' -F project="$PROJECT_ID" -F content="$ISSUE_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){
              updateProjectV2ItemFieldValue(input:{
                projectId:$project, itemId:$item, fieldId:$field,
                value:{ singleSelectOptionId:$option }
              }){ projectV2Item{ id } }
            }' -F project="$PROJECT_ID" -F item="$ITEM_ID" -F field="$FIELD_ID" -F option="$OPTION_ID" >/dev/null

      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse submission
        id: parse
        uses: ./.github/actions/parse-submission

      - name: Post preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH_LABEL: ${{ steps.parse.outputs.path_label }}
          AUTHOR: ${{ github.event.comment.user.login }}
          SUBMISSION: ${{ steps.parse.outputs.submission }}
          TYPECHECK_PASSED: ${{ steps.parse.outputs.typecheck_passed }}
          TYPECHECK_ERRORS: ${{ steps.parse.outputs.typecheck_errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node ./.github/actions/parse-submission/build-preview-body.js \
            | gh issue comment "$ISSUE_NUMBER" --body-file -
          if [ "$TYPECHECK_PASSED" != "true" ]; then
            echo "::error::Typecheck failed; the preview was posted with the errors."
            exit 1
          fi

  regenerate_preview:
    runs-on: ubuntu-latest

    if: >-
      github.event.action == 'edited' &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, '<!-- submission-preview') &&
      contains(github.event.comment.body, '- [x] Regenerate JSON') &&
      contains(github.event.changes.body.from, '- [ ] Regenerate JSON')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse submission
        id: parse
        uses: ./.github/actions/parse-submission

      - name: Update preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PATH_LABEL: ${{ steps.parse.outputs.path_label }}
          SUBMISSION: ${{ steps.parse.outputs.submission }}
          TYPECHECK_PASSED: ${{ steps.parse.outputs.typecheck_passed }}
          TYPECHECK_ERRORS: ${{ steps.parse.outputs.typecheck_errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          AUTHOR=$(printf '%s' "$COMMENT_BODY" | grep -oE 'Submission verified by @[A-Za-z0-9_-]+' | head -1 | sed -E 's/^Submission verified by @//')
          if [ -z "$AUTHOR" ]; then
            echo "::error::Could not extract original author from preview body."
            exit 1
          fi
          export AUTHOR
          node ./.github/actions/parse-submission/build-preview-body.js \
            | gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@-
          if [ "$TYPECHECK_PASSED" != "true" ]; then
            echo "::error::Typecheck failed; the preview was updated with the errors."
            exit 1
          fi

  apply_preview:
    runs-on: ubuntu-latest

    concurrency:
      group: apply-submission
      cancel-in-progress: false

    if: >-
      github.event.action == 'edited' &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, '<!-- submission-preview') &&
      contains(github.event.comment.body, 'status="ok"') &&
      contains(github.event.comment.body, '- [x] Apply this submission') &&
      contains(github.event.changes.body.from, '- [ ] Apply this submission')

    steps:
      - name: Extract submission and path from preview
        id: extract
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PATH_LABEL=$(printf '%s' "$COMMENT_BODY" | grep -oE 'submission-preview path="[^"]+"' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$PATH_LABEL" ]; then
            echo "::error::Could not extract path label from preview marker."
            exit 1
          fi
          SUBMISSION=$(printf '%s' "$COMMENT_BODY" | awk '/^```json$/{flag=1;next} /^```$/{if(flag){exit}} flag')
          if [ -z "$SUBMISSION" ]; then
            echo "::error::Could not extract JSON block from preview."
            exit 1
          fi
          echo "path_label=$PATH_LABEL" >> $GITHUB_OUTPUT
          {
            echo "submission<<__SUBMISSION_EOF__"
            echo "$SUBMISSION"
            echo "__SUBMISSION_EOF__"
          } >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.APPLIER_TOKEN }}

      - name: Modify submissions file
        env:
          SUBMISSIONS_PATH: data/${{ steps.extract.outputs.path_label }}/submissions.json
          SUBMISSION: ${{ steps.extract.outputs.submission }}
        run: |
          tmp_file=$(mktemp)
          jq ". += [${SUBMISSION}]" "$SUBMISSIONS_PATH" > "$tmp_file" && mv "$tmp_file" "$SUBMISSIONS_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit and push to main
        id: push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUBMISSIONS_PATH: data/${{ steps.extract.outputs.path_label }}/submissions.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$SUBMISSIONS_PATH"
          git commit -m "Add new submission from issue #${ISSUE_NUMBER}"
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short_sha=${SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Mark preview as applied
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          SHA: ${{ steps.push.outputs.sha }}
          SHORT_SHA: ${{ steps.push.outputs.short_sha }}
        run: |
          NEW_BODY=$(printf '%s' "$COMMENT_BODY" \
            | sed -E '/^- \[[ x]\] Apply this submission/d; /^- \[[ x]\] Regenerate JSON/d' \
            | sed -E 's/status="ok"/status="applied"/')
          {
            printf '%s\n' "$NEW_BODY"
            printf '✅ Applied in [`%s`](%s/%s/commit/%s)\n' "$SHORT_SHA" "$SERVER_URL" "$REPO" "$SHA"
          } > /tmp/applied-body.md
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@/tmp/applied-body.md
